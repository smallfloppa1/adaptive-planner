name: AI Planner CI/CD

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: Test + Build (Runs on every PR and Push to main)
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: gradle

      - name: Run Tests with Test Profile
        run: ./gradlew test -Dspring.profiles.active=test

      # Build the prod JAR here so deploy job reuses it (avoids rebuilding from scratch)
      - name: Build Prod JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./gradlew bootJar -Pprod -Dspring.profiles.active=prod

      - name: Upload JAR Artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  # JOB 2: Deploy (Runs ONLY on push to main AND if test job passes)
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Download JAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs

      - name: Copy JAR to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/var/www/ai-planner"
          strip_components: 2

      - name: Execute Remote Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Stop the service
            sudo systemctl stop ai-planner.service

            # Rollback safety: keep previous JAR as backup
            if [ -f /var/www/ai-planner/app.jar ]; then
              cp /var/www/ai-planner/app.jar /var/www/ai-planner/app.jar.bak
            fi

            # Clean up any stale JARs, then rename the new one
            rm -f /var/www/ai-planner/app.jar
            mv /var/www/ai-planner/*.jar /var/www/ai-planner/app.jar

            # Start the service
            sudo systemctl start ai-planner.service

            # Health check — fail the step (and pipeline) if service didn't come up
            sleep 5
            if ! sudo systemctl is-active --quiet ai-planner.service; then
              echo "Service failed to start. Rolling back..."
              sudo systemctl stop ai-planner.service
              mv /var/www/ai-planner/app.jar.bak /var/www/ai-planner/app.jar
              sudo systemctl start ai-planner.service
              exit 1
            fi

            echo "Deploy successful. Service is running."